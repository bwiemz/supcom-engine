# Packages (M227b): the Linux AppImage and tarball, and the Windows zip.
#
# On a `v*` tag they go to a draft GitHub release, which a person reviews
# and publishes. On a pull request that touches packaging, the same packages
# are built and run, and kept as artifacts, so a packaging change is proven
# before a tag needs it.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "tools/package/**"
      - "tools/check_version.py"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-archives
  # As in ci.yml: the manifest's builtin-baseline.
  VCPKG_COMMIT: 78b7c910015e9c9d61c47d054cab5d41934e4e28

jobs:
  linux:
    name: linux-appimage
    # The oldest supported Ubuntu LTS, for the oldest glibc (2.35): what the
    # AppImage needs of the system. GCC 13 from the toolchain PPA builds it
    # (22.04's own GCC 11 is older than any compiler ci.yml tests with), and
    # its libstdc++ is linked in (OSC_STATIC_RUNTIME).
    runs-on: ubuntu-22.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe names the tag

      - name: Install system packages
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config curl zip unzip tar \
            autoconf autoconf-archive automake libtool \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev g++-13 desktop-file-utils

      - name: Check the version and the packaging scripts
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python3 tools/check_version.py . --tag "${GITHUB_REF_NAME}"
          else
            python3 tools/check_version.py .
          fi
          shellcheck tools/package/*.sh

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-release-linux-g++-13-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: vcpkg-release-linux-g++-13-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: >
          cmake --preset linux-release -DVCPKG_MANIFEST_FEATURES=
          -DOSC_BUILD_TESTS=OFF -DOSC_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build/linux-release --target opensupcom

      - name: Package
        run: |
          tools/package/appimage.sh build/linux-release dist
          (cd build/linux-release && cpack -G TGZ -B "${GITHUB_WORKSPACE}/dist")
          rm -rf dist/_CPack_Packages

      - name: Run the packages
        run: |
          tools/package/check_linux_package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: opensupcom-linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows-zip
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python tools/check_version.py . --tag "${GITHUB_REF_NAME}"
          else
            python tools/check_version.py .
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: vcpkg-windows-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        run: cmake --preset default -DOSC_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --target opensupcom

      - name: Package
        shell: bash
        run: |
          (cd build && cpack -G ZIP -C Release -B "${GITHUB_WORKSPACE}/dist")
          rm -rf dist/_CPack_Packages

      - name: Run the package
        shell: bash
        run: |
          mkdir unpacked
          unzip -q dist/*.zip -d unpacked
          exe="$(ls unpacked/*/opensupcom.exe)"
          "${exe}" --version | tee version.txt
          grep -Eq '^OpenSupCom [0-9]+\.[0-9]+\.[0-9]+ \(' version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: opensupcom-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: draft-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The release's notes: its CHANGELOG.md section (the heading
          # matched as a plain string: a version's dots aren't wildcards)
          awk -v h="## [${version}]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --draft \
            --title "OpenSupCom ${version}" --notes-file notes.md
